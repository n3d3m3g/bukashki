name: Deploy static site

on:
  push:
    branches: [ main ]
  workflow_dispatch:          # позволяет запускать вручную кнопкой

permissions:
  contents: read
  pages: write
  id-token: write

# Отменяет старые запуски, если начался новый
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ИСПРАВЛЕННЫЙ ШАГ ПРОВЕРКИ
      - name: Check required files
        run: |
          echo "Проверяем наличие нужных файлов..."
          MISSING=0
          
          if [ -f index.html ]; then
            echo "✅ index.html — найден"
          else
            echo "❌ ОШИБКА: index.html — НЕ найден!"
            MISSING=1
          fi
          
          if [ -f style.css ]; then
            echo "✅ style.css — найден"
          else
            echo "❌ ОШИБКА: style.css — НЕ найден!"
            MISSING=1
          fi
          
          if [ $MISSING -eq 1 ]; then
            echo "Проверка не пройдена. Останавливаем деплой."
            exit 1
          fi
          
          echo "Все файлы на месте. Проверка пройдена."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
