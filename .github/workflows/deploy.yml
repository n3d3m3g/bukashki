name: Deploy static site

on:
  push:
    branches: [ main ]
  workflow_dispatch:          # можно запускать вручную кнопкой

permissions:
  contents: read
  pages: write
  id-token: write

# Не даём запускаться нескольким деплоям одновременно
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo "Проверяем наличие нужных файлов..."
          test -f index.html && echo "index.html — найден"
          test -f style.css && echo "style.css — найден"
          echo "Проверка пройдена"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
